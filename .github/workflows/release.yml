name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      AMIVOICE_APP_KEY: ${{ secrets.AMIVOICE_APP_KEY }}
      AMIVOICE_ENGINE: ${{ secrets.AMIVOICE_ENGINE }}
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version

      - name: Write .env.production
        shell: bash
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}"
            echo "AMIVOICE_APP_KEY=${AMIVOICE_APP_KEY}"
            echo "AMIVOICE_ENGINE=${AMIVOICE_ENGINE}"
            echo "SLACK_CLIENT_ID=${SLACK_CLIENT_ID}"
          } > .env.production

      - name: Prepare signing certificate
        shell: bash
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "CSC_LINK secret is missing" >&2
            exit 1
          fi
          if [[ "$CSC_LINK" == http* ]]; then
            echo "Using CSC_LINK as URL"
          else
            echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
            echo "CSC_LINK=/tmp/cert.p12" >> $GITHUB_ENV
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      - name: Build and publish (macOS)
        run: |
          npm run build
          npx electron-builder --mac --publish always

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      AMIVOICE_APP_KEY: ${{ secrets.AMIVOICE_APP_KEY }}
      AMIVOICE_ENGINE: ${{ secrets.AMIVOICE_ENGINE }}
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version

      - name: Write .env.production
        shell: bash
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}"
            echo "AMIVOICE_APP_KEY=${AMIVOICE_APP_KEY}"
            echo "AMIVOICE_ENGINE=${AMIVOICE_ENGINE}"
            echo "SLACK_CLIENT_ID=${SLACK_CLIENT_ID}"
          } > .env.production

      - name: Build and publish (Windows)
        run: |
          npm run build
          npx electron-builder --win --publish always
